name: coupon-lab

x-kafka-environment: &kafka-environment
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
  KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_NUM_PARTITIONS: 6
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_NUM_NETWORK_THREADS: 2
  KAFKA_NUM_IO_THREADS: 2
  KAFKA_HEAP_OPTS: -Xms256m -Xmx512m -XX:+ExitOnOutOfMemoryError
  KAFKA_LOG_DIRS: /var/lib/kafka/data

x-kafka: &kafka
  image: apache/kafka:3.8.1
  restart: "no"
  mem_limit: 1g
  healthcheck:
    test: [CMD-SHELL, "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
    interval: 15s
    timeout: 10s
    retries: 15
    start_period: 30s

x-sentinel: &sentinel
  image: redis:7-alpine
  profiles: [sentinel]
  restart: "no"
  mem_limit: 64m
  depends_on:
    redis-primary:
      condition: service_healthy
    redis-replica:
      condition: service_healthy
  command:
    - sh
    - -c
    - |
      cat >/tmp/sentinel.conf <<EOF
      port 26379
      bind 0.0.0.0
      protected-mode no
      sentinel resolve-hostnames yes
      sentinel announce-hostnames yes
      sentinel monitor coupon-primary redis-primary 6379 2
      sentinel down-after-milliseconds coupon-primary 3000
      sentinel failover-timeout coupon-primary 15000
      sentinel parallel-syncs coupon-primary 1
      EOF
      exec redis-sentinel /tmp/sentinel.conf
  healthcheck:
    test: [CMD, redis-cli, -p, "26379", PING]
    interval: 5s
    timeout: 3s
    retries: 10

x-cluster: &cluster
  image: redis:7-alpine
  profiles: [cluster]
  restart: "no"
  mem_limit: 128m
  command: [redis-server, --appendonly, "yes", --appendfsync, everysec, --save, "", --maxmemory, 96mb, --maxmemory-policy, noeviction, --cluster-enabled, "yes", --cluster-config-file, nodes.conf, --cluster-node-timeout, "5000"]
  healthcheck:
    test: [CMD, redis-cli, PING]
    interval: 3s
    timeout: 2s
    retries: 20

services:
  mysql:
    image: mysql:8.0
    restart: "no"
    mem_limit: 512m
    environment:
      MYSQL_ROOT_PASSWORD: couponroot
      MYSQL_DATABASE: coupon_lab
      MYSQL_USER: coupon
      MYSQL_PASSWORD: coupon
    command: [--innodb-buffer-pool-size=64M, --max-connections=80, --performance-schema=OFF]
    ports: ["127.0.0.1:23306:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, "MYSQL_PWD=coupon mysql -h127.0.0.1 -ucoupon -Dcoupon_lab -Nse 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  redis-primary:
    image: redis:7-alpine
    restart: "no"
    mem_limit: 192m
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec, --save, "", --maxmemory, 128mb, --maxmemory-policy, noeviction]
    ports: ["127.0.0.1:26379:6379"]
    volumes: [redis-primary-data:/data]
    healthcheck:
      test: [CMD, redis-cli, PING]
      interval: 3s
      timeout: 2s
      retries: 20

  redis-replica:
    image: redis:7-alpine
    restart: "no"
    mem_limit: 192m
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec, --save, "", --maxmemory, 128mb, --maxmemory-policy, noeviction, --replicaof, redis-primary, "6379"]
    ports: ["127.0.0.1:26380:6379"]
    volumes: [redis-replica-data:/data]
    depends_on:
      redis-primary:
        condition: service_healthy
    healthcheck:
      test: [CMD, redis-cli, PING]
      interval: 3s
      timeout: 2s
      retries: 20

  kafka1:
    <<: *kafka
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:9092,EXTERNAL://127.0.0.1:29092
    ports: ["127.0.0.1:29092:19092"]
    volumes: [kafka1-data:/var/lib/kafka/data]

  kafka2:
    <<: *kafka
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:9092,EXTERNAL://127.0.0.1:29093
    ports: ["127.0.0.1:29093:19092"]
    volumes: [kafka2-data:/var/lib/kafka/data]

  kafka3:
    <<: *kafka
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:9092,EXTERNAL://127.0.0.1:29094
    ports: ["127.0.0.1:29094:19092"]
    volumes: [kafka3-data:/var/lib/kafka/data]

  cluster1:
    <<: *cluster
    ports: ["127.0.0.1:27379:6379"]
    volumes: [cluster1-data:/data]
  cluster2:
    <<: *cluster
    ports: ["127.0.0.1:27380:6379"]
    volumes: [cluster2-data:/data]
  cluster3:
    <<: *cluster
    ports: ["127.0.0.1:27381:6379"]
    volumes: [cluster3-data:/data]

  sentinel1:
    <<: *sentinel
    ports: ["127.0.0.1:26381:26379"]
  sentinel2:
    <<: *sentinel
    ports: ["127.0.0.1:26382:26379"]
  sentinel3:
    <<: *sentinel
    ports: ["127.0.0.1:26383:26379"]

volumes:
  cluster1-data:
  cluster2-data:
  cluster3-data:
  mysql-data:
  redis-primary-data:
  redis-replica-data:
  kafka1-data:
  kafka2-data:
  kafka3-data:
