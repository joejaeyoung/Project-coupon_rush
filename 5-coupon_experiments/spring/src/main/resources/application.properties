server.address=127.0.0.1
server.port=${LAB_PORT:28080}
server.tomcat.threads.max=128
spring.datasource.url=${LAB_MYSQL_URL:jdbc:mysql://localhost:23306/coupon_lab?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${LAB_MYSQL_USER:coupon}
spring.datasource.password=${LAB_MYSQL_PASSWORD:coupon}
spring.datasource.hikari.maximum-pool-size=32
spring.datasource.hikari.connection-timeout=5000
spring.data.redis.host=${LAB_REDIS_HOST:localhost}
spring.data.redis.port=${LAB_REDIS_PORT:26379}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s
lab.kafka.bootstrap=${LAB_KAFKA_BOOTSTRAP:localhost:29092,localhost:29093,localhost:29094}
management.endpoints.web.exposure.include=health,metrics
management.health.redis.enabled=false
logging.level.org.apache.kafka=WARN
logging.level.io.lettuce.core=WARN
