# ── 데이터 영속성 ────────────────────────────────────────────
# AOF (Append Only File): 모든 쓰기 명령 기록
appendonly yes
appendfsync everysec

# RDB 스냅샷: 변경 발생 시 주기적 저장
save 900 1
save 300 10
save 60  10000

# ── 데이터 저장 경로 ──────────────────────────────────────────
dir /data

# ── 기본 설정 ────────────────────────────────────────────────
bind 0.0.0.0
protected-mode no
port 6379
