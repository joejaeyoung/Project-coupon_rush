spring:
  application:
    name: coupon

  # ── MySQL ──────────────────────────────────────────────────
  datasource:
    url: jdbc:mysql://localhost:3306/coupon_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: coupon
    password: coupon

  # ── JPA ────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update

  # ── Redis: 기본값 localhost:6379. 컨테이너에서는 SPRING_DATA_REDIS_HOST/PORT 환경변수로 덮어쓴다 ──

  # ── Kafka ──────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: coupon-group
      auto-offset-reset: earliest
      # false: @KafkaListener가 정상 종료된 뒤 Offset 커밋 → DB INSERT 실패 시 Kafka가 재전송 (at-least-once)
      enable-auto-commit: false
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.example.coupon.event
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # 발급 API는 브로커 ACK(acks=all)를 받은 뒤에야 202를 돌려준다. 실패하면 Redis 예약을 되돌린다.
      acks: all
      properties:
        enable.idempotence: true
        # 포기 시점을 분명히 한다 — producer가 재시도를 끝낸 뒤에야 예약을 되돌리므로 되돌린 예약의 이벤트가 뒤늦게 도착하지 않는다
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        max.block.ms: 5000

# ── Actuator (Prometheus 메트릭 노출) ──────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  metrics:
    tags:
      application: ${spring.application.name}
