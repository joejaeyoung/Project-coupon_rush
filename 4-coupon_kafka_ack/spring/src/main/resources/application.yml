spring:
  application:
    name: coupon

  # ── MySQL ──────────────────────────────────────────────────
  datasource:
    url: jdbc:mysql://localhost:3306/coupon_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: coupon
    password: coupon
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ── JPA ────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  # ── Redis ──────────────────────────────────────────────────
  data:
    redis:
      host: localhost
      port: 6379

  # ── Kafka ──────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: coupon-group
      auto-offset-reset: earliest
      # false: @KafkaListener가 정상 종료된 뒤 Offset 커밋 → DB INSERT 실패 시 Kafka가 재전송 (at-least-once)
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.example.coupon.event
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # 발급 API는 브로커 ACK(acks=all)를 받은 뒤에야 202를 돌려준다. 실패하면 Redis 예약을 되돌린다.
      acks: all
      properties:
        enable.idempotence: true
        # 포기 시점을 분명히 한다 — ACK 대기(12s) 안에 producer 재시도가 끝나야 되돌린 예약이 뒤늦게 도착하지 않는다
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        max.block.ms: 5000

# ── Actuator (Prometheus 메트릭 노출) ──────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
