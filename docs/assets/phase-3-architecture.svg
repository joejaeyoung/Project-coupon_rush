<text x="860" y="378" font-size="16" fill="#334155" font-weight="400" text-anchor="start">topic: coupon-issue</text>
<text x="860" y="404" font-size="14" fill="#3730a3" font-weight="400" text-anchor="start">key: couponId</text>
