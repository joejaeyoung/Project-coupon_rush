<text x="745" y="525" font-size="14" fill="#334155" font-weight="400" text-anchor="start">DB 저장</text>
<rect x="32" y="611" width="1053" height="60" rx="9" fill="#eef2f6" stroke="#e2e8f0" stroke-width="1.4"/>
<text x="54" y="637" font-size="14" fill="#334155" font-weight="700" text-anchor="start">응답 경계</text>
<text x="160" y="637" font-size="16" fill="#334155" font-weight="400" text-anchor="start">202는 전송 Future와 DB 저장 완료를 기다리지 않습니다.</text>
<text x="160" y="658" font-size="13" fill="#64748b" font-weight="400" text-anchor="start">실선: 호출·조회·소비     점선: 비동기 전송     접수 응답과 Consumer 완료 순서는 고정되지 않습니다.</text>
