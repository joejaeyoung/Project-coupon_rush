<path d="M712 238 H772 V209 H838" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<rect x="753" y="172" width="45" height="24" rx="4" fill="#f8fafc"/>
<text x="758" y="188" font-size="14" fill="#334155" font-weight="400" text-anchor="start">판정</text>
<path d="M712 286 H799 V350 H838" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<rect x="741" y="293" width="87" height="24" rx="4" fill="#f8fafc"/>
<text x="746" y="309" font-size="14" fill="#334155" font-weight="400" text-anchor="start">비동기 전송</text>
<path d="M838 391 H793 V448 H712" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
