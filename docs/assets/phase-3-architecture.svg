<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
<title id="title">Coupon Rush Phase 3 architecture</title>
<desc id="desc">One Spring Boot application receives HTTP requests, checks Redis, schedules Kafka delivery, and returns 202 without awaiting delivery. Its consumer saves issued coupons in a MySQL transaction. HTTP completion and consumer completion are independent.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs>
<rect width="1120" height="700" rx="16" fill="#f8fafc"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', Arial, sans-serif">
<text x="32" y="45" font-size="27" fill="#0f172a" font-weight="650" text-anchor="start">Coupon Rush  /  Phase 3</text>
<text x="32" y="77" font-size="17" fill="#475569" font-weight="400" text-anchor="start">Redis 판정 · Kafka 비동기 전달 · MySQL 저장</text>
<rect x="250" y="124" width="502" height="453" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
<text x="272" y="156" font-size="13" fill="#2563eb" font-weight="700" text-anchor="start">SPRING BOOT</text>
<text x="731" y="156" font-size="14" fill="#475569" font-weight="400" text-anchor="end">하나의 애플리케이션</text>
<rect x="32" y="221" width="163" height="112" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.4"/>
<text x="113" y="255" font-size="20" fill="#9a3412" font-weight="600" text-anchor="middle">Client / k6</text>
<text x="113" y="283" font-size="16" fill="#334155" font-weight="400" text-anchor="middle">발급 요청</text>
<text x="113" y="309" font-size="13" fill="#9a3412" font-weight="400" text-anchor="middle">HTTP :8080</text>
<rect x="289" y="213" width="170" height="112" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
<text x="374" y="246" font-size="20" fill="#1e3a8a" font-weight="600" text-anchor="middle">Controller</text>
<text x="374" y="274" font-size="14" fill="#334155" font-weight="400" text-anchor="middle">CouponService 호출</text>
<text x="374" y="302" font-size="14" fill="#334155" font-weight="400" text-anchor="middle">성공 경로: 202 접수</text>
<rect x="532" y="213" width="180" height="112" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
<text x="622" y="246" font-size="19" fill="#1e3a8a" font-weight="600" text-anchor="middle">CouponService</text>
<text x="622" y="274" font-size="14" fill="#334155" font-weight="400" text-anchor="middle">기간 · 중복 · 재고 판정</text>
<text x="622" y="302" font-size="14" fill="#334155" font-weight="400" text-anchor="middle">Producer.send() 호출</text>
<rect x="289" y="414" width="423" height="119" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
<text x="314" y="450" font-size="21" fill="#1e3a8a" font-weight="600" text-anchor="start">CouponKafkaConsumer</text>
<text x="314" y="481" font-size="16" fill="#334155" font-weight="400" text-anchor="start">기존 발급 확인 → 수량 증가 → 발급 저장</text>
<text x="314" y="510" font-size="14" fill="#475569" font-weight="400" text-anchor="start">@KafkaListener  ·  DB @Transactional</text>
<rect x="838" y="161" width="247" height="102" rx="10" fill="#ccfbf1" stroke="#5eead4" stroke-width="1.4"/>
<text x="860" y="195" font-size="21" fill="#115e59" font-weight="600" text-anchor="start">Redis 7</text>
<text x="860" y="224" font-size="16" fill="#334155" font-weight="400" text-anchor="start">기간 · 재고 · 사용자 집합</text>
<text x="860" y="247" font-size="14" fill="#115e59" font-weight="400" text-anchor="start">GET  /  SADD  /  DECR</text>
