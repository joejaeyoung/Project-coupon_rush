name: coupon-redisha-kafka

# Redis 묶음(primary · replica · Sentinel 3)은 redis-net 컨테이너의 네트워크 네임스페이스를 공유한다.
# 서로를 127.0.0.1:<port>로 보고, 같은 포트를 호스트에 그대로 노출하므로 Sentinel이 알려주는
# 주소(127.0.0.1:6381/6382)가 컨테이너 안에서도 호스트의 앱에서도 똑같이 통한다 (Docker Desktop에서 Sentinel을 쓰는 가장 짧은 길).
x-sentinel: &sentinel
  image: redis:7-alpine
  network_mode: "service:redis-net"
  depends_on: [redis-primary, redis-replica]
  entrypoint: ["sh", "-c"]
  command:
    - |
      printf 'port %s\ndir /tmp\nsentinel monitor mymaster 127.0.0.1 6381 2\nsentinel down-after-milliseconds mymaster 2000\nsentinel failover-timeout mymaster 10000\nsentinel parallel-syncs mymaster 1\nsentinel announce-ip 127.0.0.1\nsentinel announce-port %s\n' "$$SENTINEL_PORT" "$$SENTINEL_PORT" > /tmp/sentinel.conf
      exec redis-sentinel /tmp/sentinel.conf
  healthcheck:
    test: ["CMD-SHELL", "redis-cli -p $$SENTINEL_PORT ping"]
    interval: 5s
    timeout: 3s
    retries: 5

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: couponroot
      MYSQL_DATABASE: coupon_db
      MYSQL_USER: coupon
      MYSQL_PASSWORD: coupon
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-net:
    image: alpine:3.20
    container_name: redis-net
    command: sleep infinity
    ports:
      - "6381:6381"     # primary (처음 기동 시)
      - "6382:6382"     # replica
      - "26379:26379"   # sentinel ×3
      - "26380:26380"
      - "26381:26381"

  redis-primary:
    image: redis:7-alpine
    container_name: redis-primary
    network_mode: "service:redis-net"
    depends_on: [redis-net]
    command: redis-server --port 6381 --appendonly yes --replica-announce-ip 127.0.0.1 --replica-announce-port 6381
    volumes:
      - redis_primary:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6381", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-replica:
    image: redis:7-alpine
    container_name: redis-replica
    network_mode: "service:redis-net"
    depends_on: [redis-primary]
    command: redis-server --port 6382 --appendonly yes --replicaof 127.0.0.1 6381 --replica-announce-ip 127.0.0.1 --replica-announce-port 6382
    volumes:
      - redis_replica:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6382", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  sentinel-1:
    <<: *sentinel
    container_name: sentinel-1
    environment: { SENTINEL_PORT: "26379" }
  sentinel-2:
    <<: *sentinel
    container_name: sentinel-2
    environment: { SENTINEL_PORT: "26380" }
  sentinel-3:
    <<: *sentinel
    container_name: sentinel-3
    environment: { SENTINEL_PORT: "26381" }

  kafka:
    image: apache/kafka:3.7.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_NODE_ID: "1"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "EXTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  mysql_data:
  redis_primary:
  redis_replica:
  kafka_data:
