spring:
  application:
    name: coupon

  # ── MySQL ──────────────────────────────────────────────────
  datasource:
    url: jdbc:mysql://localhost:3306/coupon_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: coupon
    password: coupon

  # ── JPA ────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update
    # 발급 핫패스는 DB를 보지 않는다 — 요청마다 Session을 여는 OSIV는 끈다
    open-in-view: false

  # ── Redis: Sentinel에게 primary 주소를 묻는다. failover로 primary가 바뀌면 Lettuce가 +switch-master를 받아 다시 붙는다 ──
  data:
    redis:
      sentinel:
        master: mymaster
        nodes: localhost:26379,localhost:26380,localhost:26381

  # ── Kafka ──────────────────────────────────────────────────
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: coupon-group
      auto-offset-reset: earliest
      # Kafka 자동 커밋을 끄고 리스너 컨테이너가 offset을 관리한다. ack-mode는 별도 지정하지 않는다.
      # DB 트랜잭션과 offset 커밋은 별개다. 실패 재전달에 대비해 Consumer에서 중복을 검사한다.
      enable-auto-commit: false
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.example.coupon.event
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # 발급 API는 브로커 ACK(acks=all)를 받은 뒤에야 202를 돌려준다. 실패하면 Redis 예약을 되돌린다.
      # Compose는 단일 브로커이므로 이 설정만으로 Kafka 복제본 HA가 구성되지는 않는다.
      acks: all
      properties:
        # 재시도 중 같은 배치가 브로커에 두 번 쓰이지 않게(PID·시퀀스). 클라이언트 기본값이지만 acks=all과 짝이라 명시
        enable.idempotence: true
        # 포기 시점을 분명히 한다 — 되돌린 뒤에 producer가 재시도를 이어가지 않는다.
        # ACK만 유실된 이벤트는 보상·503 이후에도 소비될 수 있다. DB 총량 가드는 초과 발급만 막는다.
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        max.block.ms: 5000

# ── 발급 예약의 복제 확인 ──────────────────────────────────────
coupon:
  redis:
    # 예약(SADD·DECR)을 replica 몇 대가 받은 뒤 승인할지 (WAIT). 0이면 확인 없이 승인 — failover 때 승인된 예약이 사라질 수 있다
    wait-replicas: 1
    # 이 시간 안에 복제되지 않으면 예약을 되돌리고 503. WAIT가 공유 커넥션을 막으므로 replica 장애 중에는 요청당 이만큼 느려진다
    wait-timeout-ms: 1000
