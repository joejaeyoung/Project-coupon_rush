plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.kafka:spring-kafka'

	//Monitoring
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'

	//DB
	runtimeOnly 'com.mysql:mysql-connector-j'

	//Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Instrumentation and fault injection are packaged only by this separate task.
sourceSets {
	lab {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}
configurations {
	labImplementation.extendsFrom implementation
	labRuntimeOnly.extendsFrom runtimeOnly
}
tasks.register('labBootJar', org.springframework.boot.gradle.tasks.bundling.BootJar) {
	group = 'verification'
	description = 'Build the local Kafka experiment app, including measurement and fault hooks.'
	archiveClassifier = 'kafka-lab'
	mainClass = 'com.example.coupon.CouponApplication'
	targetJavaVersion = JavaVersion.VERSION_17
	classpath = sourceSets.lab.runtimeClasspath
}
